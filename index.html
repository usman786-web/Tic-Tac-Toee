<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="scoreboard">

    <div class="score">
        ⭕ O Wins :
        <span id="oScore">0</span>
    </div>

    <div class="score">
        ❌ X Wins :
        <span id="xScore">0</span>
    </div>

    <div class="score">
        🤝 Draws :
        <span id="drawScore">0</span>
    </div>

</div>
    <div class="msgcontainer hide">
        <p id="msg">Winner</p>
        <button id="newbtn">New Game</button>
    </div>
    <main>
        <h1>Tic Tac Toe</h1>
        <button id="modeBtn">🌙 Dark Mode</button>
        <div class="container">
            <div class="game">
                 <div id="winLine"></div>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <button id="reset">Reset Game</button>
    </main>
    <script src="app.js"></script>
</body>
</html>
